name: Vop Trade CI

on:
  push:
    branches:
      - main
      - ci/*
    tags:
  release:
    types: [published]
  pull_request:
  schedule:
    - cron:  '0 3 * * 4'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true
permissions: {}

jobs:
  tests:
    name: "Tests and Linting"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "ubuntu-22.04", "ubuntu-24.04", "ubuntu-26.04", "ubuntu-24.04-arm", "macos-14", "macos-15" , "windows-2022", "windows-2025" ]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: "ubuntu-22.04"
            python-version: "3.13"
          - os: "ubuntu-22.04"
            python-version: "3.14"
          # Reduce ARM runs to newer python versions
          - os: "ubuntu-24.04-arm"
            python-version: "3.11"
          - os: "ubuntu-24.04-arm"
            python-version: "3.12"
          # ubuntu 26.04 has 3.14 as default python version
          - os: "ubuntu-26.04"
            python-version: "3.11"
          - os: "ubuntu-26.04"
            python-version: "3.12"
          - os: "ubuntu-26.04"
            python-version: "3.13"


    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Install uv and Python 🐍
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        activate-environment: true
        enable-cache: true # zizmor: ignore[cache-poisoning] - this job is not used for release builds
        python-version: ${{ matrix.python-version }}
        cache-dependency-glob: "requirements**.txt"
        cache-suffix: "${{ matrix.python-version }}"

    - name: Installation - macOS (Brew)
      if: ${{ runner.os == 'macOS' }}
      run: |
        # brew update
        # TODO: Should be the brew upgrade
        brew install libomp

    - name: Installation (python)
      run: |
        uv pip install -r requirements-dev.txt
        uv pip install -e ft_client/
        uv pip install -e .

    - name: Check for version alignment
      run: |
        python build_helpers/voptrade_client_version_align.py

    - name: Tests
      if: (!(runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04'))
      run: |
        pytest --random-order --durations 20 -n auto

    - name: Tests with Coveralls
      if: (runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04')
      run: |
        pytest --random-order --cov=voptrade --cov=voptrade_client --cov-config=.coveragerc

    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      if: (runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04')
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}  # zizmor: ignore[secrets-outside-env] Intentionally not using environment variable.

    - name: Cleanup codecov dirty state files
      if: (runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04')
      run: |
        # See https://github.com/codecov/codecov-action/issues/1851
        rm -rf codecov codecov.SHA256SUM codecov.SHA256SUM.sig

    - name: Run json schema extract
      # This must be kept before the repository check to ensure that the schema is up-to-date
      run: |
        python build_helpers/extract_config_json_schema.py

    - name: Run command docs partials extract
      # This must be kept before the repository check to ensure that the docs are up-to-date
      if: ${{ (matrix.python-version == '3.13') }}
      run: |
        python build_helpers/create_command_partials.py

    - name: Check for repository changes - *nix
      if: ${{ (runner.os != 'Windows') }}
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Repository is dirty, changes detected:"
          git status
          git diff
          exit 1
        else
          echo "Repository is clean, no changes detected."
        fi

    - name: Check for repository changes - Windows
      if: ${{ runner.os == 'Windows' }}
      run: |
        if (git status --porcelain) {
          Write-Host "Repository is dirty, changes detected:"
          git status
          git diff
          exit 1
        }
        else {
          Write-Host "Repository is clean, no changes detected."
        }

    - name: Backtesting (multi)
      run: |
        voptrade create-userdir --userdir user_data
        cp tests/testdata/config.tests.json user_data/config.json
        voptrade new-strategy -s AwesomeStrategy
        voptrade new-strategy -s AwesomeStrategyMin --template minimal
        voptrade new-strategy -s AwesomeStrategyAdv --template advanced
        voptrade backtesting --datadir tests/testdata --strategy-list AwesomeStrategy AwesomeStrategyMin AwesomeStrategyAdv -i 5m

    - name: Hyperopt
      run: |
        cp tests/testdata/config.tests.json config.json
        voptrade create-userdir --userdir user_data
        voptrade hyperopt --datadir tests/testdata -e 6 --strategy SampleStrategy --hyperopt-loss SharpeHyperOptLossDaily --print-all

    - name: Run Ruff
      run: |
        ruff check --output-format=github

    - name: Run Ruff format check
      run: |
        ruff format --check

    - name: Mypy
      if: ${{ matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15' }}
      run: |
        mypy voptrade scripts tests

    - name: Run Pester tests (PowerShell)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $PSVersionTable
        Install-PSResource -Name Pester -Version '[5.7.1]' -TrustRepository -Reinstall
        $Error.clear()

        # Override Clear-Host globally to prevent headless console crashes
        Function Clear-Host { }

        Invoke-Pester -Path "tests" -CI
        if ($Error.Length -gt 0) {exit 1}

    - name: Discord notification
      uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
      if: ${{ failure() && ( github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
      with:
          color: '#FF0000' # red
          title: Voptrade CI failed on ${{ matrix.os }} with Python ${{ matrix.python-version }}!
          webhook: ${{ secrets.DISCORD_WEBHOOK }}  # zizmor: ignore[secrets-outside-env] Intentionally not using environment variable.

  mypy-version-check:
    name: "Mypy Version Check"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Install uv and Python 🐍
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        activate-environment: true
        python-version: "3.13"
        enable-cache: false

    - name: pre-commit dependencies
      run: |
        uv pip install $(grep -E "^pyyaml==" requirements-dev.txt)
        python build_helpers/pre_commit_update.py

  pre-commit:
    name: "Pre-commit checks"
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Set up Python 🐍
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.13"

    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  docs-check:
    name: "Documentation build"
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Documentation syntax
      run: |
        ./tests/test_docs.sh

    - name: Install uv and Python 🐍
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        activate-environment: true
        python-version: "3.13"
        enable-cache: false

    - name: Documentation build
      run: |
        uv pip install -r docs/requirements-docs.txt
        mkdocs build

    - name: Discord notification
      uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
      if: failure() && ( github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
      with:
          color: '#FF0000' # red
          title: Voptrade doc test failed!
          webhook: ${{ secrets.DISCORD_WEBHOOK }}  # zizmor: ignore[secrets-outside-env] Intentionally not using environment variable.


  build-linux-online:
    # Run pytest with "live" checks
    name: "Online / live tests"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Install uv and Python 🐍
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        activate-environment: true
        enable-cache: true # zizmor: ignore[cache-poisoning] - this job is not used for release builds
        python-version: "${{ matrix.python-version }}"
        cache-dependency-glob: "requirements**.txt"
        cache-suffix: "3.12"

    - name: Installation - *nix
      run: |
        uv pip install -r requirements-dev.txt
        uv pip install -e ft_client/
        uv pip install -e .

    - name: Tests incl. ccxt compatibility tests
      env:
        CI_WEB_PROXY: http://152.67.66.8:13128
      run: |
        pytest --random-order --longrun --durations 20 -n auto


  build:
    if: always()
    name: "Build"
    needs: [
      tests,
      docs-check,
      mypy-version-check,
      pre-commit,
    ]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:

    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
      with:
        jobs: ${{ toJSON(needs) }}

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Install uv and Python 🐍
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        activate-environment: true
        python-version: "${{ matrix.python-version }}"
        # Don't cache to avoid cache poisoning
        enable-cache: false

    - name: Build distribution
      run: |
        uv pip install $(grep -E "^build==" requirements-dev.txt)
        python -m build --sdist --wheel

    - name: Upload artifacts 📦
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: voptrade-build
        path: |
          dist
        retention-days: 10

    - name: Build Client distribution
      run: |
        python -m build --sdist --wheel ft_client

    - name: Upload artifacts 📦
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: voptrade-client-build
        path: |
          ft_client/dist
        retention-days: 10

